var STP={"bench": {"s": ["Acostate con los ojos bajo la barra, los pies firmes en el piso y las escápulas juntas hacia abajo.", "Sacá la barra con los brazos estirados y bajala controlada hasta el pecho medio.", "Empujá hacia arriba en línea recta hasta estirar los brazos, sin despegar la cadera del banco."], "e": ["Rebotar la barra en el pecho.", "Abrir demasiado los codos o levantar la cadera. Con cargas altas, pedí que alguien te cuide."]}, "incdb": {"s": ["Regulá el banco a unos 30° y sentate con la espalda y los pies firmes.", "Empezá con las mancuernas a la altura del pecho y empujá hacia arriba sin chocarlas.", "Bajá lento hasta sentir el estiramiento en el pecho, con los antebrazos verticales."], "e": ["Subir demasiado el banco: pasa a ser un press de hombros.", "Dejar caer las mancuernas hacia los costados."]}, "ohp": {"s": ["De pie, con la barra apoyada en la parte alta del pecho y el agarre un poco más ancho que los hombros.", "Apretá glúteos y abdomen y empujá la barra en línea recta, echando la cara apenas hacia atrás.", "Terminá con la barra sobre la cabeza y los brazos estirados. Bajá controlado."], "e": ["Arquear la espalda baja para empujar.", "Empujar la barra hacia adelante en lugar de recto hacia arriba."]}, "tri": {"s": ["Parate frente a la polea alta con los codos pegados a las costillas.", "Estirá los codos hacia abajo hasta extenderlos del todo, sin mover los hombros.", "Volvé lento hasta que los codos queden en unos 90°."], "e": ["Abrir los codos o balancear el torso.", "Usar tanto peso que se mueve todo el cuerpo."]}, "pull": {"s": ["Colgate de la barra con un agarre un poco más ancho que los hombros y los brazos estirados.", "Tirá llevando los codos hacia abajo y el pecho hacia la barra.", "Subí hasta pasar el mentón por la barra y bajá lento hasta estirar los brazos."], "e": ["Balancearte o patalear para subir.", "Hacer medias repeticiones sin estirar del todo. Si todavía no podés, probá con remo invertido o con una banda de ayuda."]}, "row": {"s": ["Con la barra en el piso, llevá la cadera atrás y agarrala con los brazos estirados.", "Inclinate unos 45° con la espalda neutra y las rodillas apenas flexionadas.", "Llevá la barra hacia el ombligo juntando las escápulas y bajá controlado."], "e": ["Redondear la espalda.", "Usar el impulso del torso para subir la barra."]}, "lat": {"s": ["Ajustá el apoyo de las piernas y agarrá la barra un poco más ancha que los hombros.", "Con el pecho arriba, jalá la barra hacia la parte alta del pecho llevando los codos abajo y atrás.", "Volvé lento hasta estirar los brazos, sin que el peso te levante del asiento."], "e": ["Inclinarte mucho hacia atrás para ayudarte.", "Jalar la barra por detrás de la nuca."]}, "curl": {"s": ["De pie, con las mancuernas a los costados y los codos pegados al cuerpo.", "Subí las mancuernas girando las palmas hacia arriba, sin mover los codos.", "Bajá lento, en 2 a 3 segundos, hasta estirar los brazos."], "e": ["Balancear el torso para subir.", "Soltar la bajada, que es la parte que más trabaja."]}, "squat": {"s": ["Apoyá la barra en la parte alta de la espalda, con los pies al ancho de hombros y las puntas apenas hacia afuera.", "Respirá hondo, apretá el abdomen y bajá llevando la cadera atrás y las rodillas hacia afuera.", "Bajá hasta donde puedas con la espalda neutra y subí empujando el piso con todo el pie."], "e": ["Dejar que las rodillas se metan hacia adentro al subir.", "Levantar los talones o redondear la espalda baja. Con cargas altas, usá los topes de seguridad del rack."]}, "press": {"s": ["Sentate con la espalda y la cadera bien apoyadas y los pies a la altura de los hombros en la plataforma.", "Soltá los seguros y bajá controlado hasta que las rodillas lleguen cerca del pecho, sin despegar la cadera.", "Empujá con todo el pie hasta casi estirar las piernas, sin bloquear las rodillas."], "e": ["Bajar tanto que la cadera se despega del respaldo.", "Bloquear las rodillas arriba o dejar que se vayan hacia adentro."]}, "rdl": oger los hombros o despegar la espalda."]}, "goblet": {"s": ["Sostené una mancuerna vertical contra el pecho con las dos manos.", "Con los pies al ancho de hombros, bajá entre las rodillas con el torso erguido.", "Subí empujando con todo el pie, con los talones apoyados."], "e": ["Inclinar el torso hacia adelante.", "Dejar que las rodillas se metan hacia adentro."]}, "bulg": {"s": ["De espaldas a un banco, apoyá el empeine de un pie atrás y dá un paso largo con el otro.", "Bajá recto hasta que el muslo de adelante quede casi paralelo al piso.", "Subí empujando con el talón de adelante y cambiá de pierna al terminar la serie."], "e": ["Poner el pie de adelante demasiado cerca del banco.", "Inclinar el torso o cargar el peso en la pierna de atrás."]}, "stepup": {"s": ["Parate frente a un cajón o banco firme, con una mancuerna en cada mano.", "Apoyá todo el pie de una pierna y subí empujando con el talón.", "Bajá controlado con la misma pierna, sin dejarte caer, y repetí por lado."], "e": ["Impulsarte con la pierna de abajo.", "Usar un cajón tan alto que te obliga a inclinar el torso."]}, "kick": {"s": ["Con la tobillera en un pie, parate frente a la polea baja y sostenete de la máquina.", "Llevá la pierna hacia atrás con la rodilla casi estirada, apretando el glúteo.", "Volvé lento sin apoyar el peso y repetí por lado."], "e": ["Arquear la espalda baja para subir más la pierna.", "Balancear la pierna con impulso."]}, "crunch": {"s": ["Acostate boca arriba con las rodillas flexionadas y los pies apoyados.", "Cruzá los brazos sobre el pecho o poné las manos al costado de la cabeza, sin tirar del cuello.", "Subí los hombros del piso exhalando y bajá lento."], "e": ["Tirar del cuello con las manos.", "Subir con impulso en lugar de con el abdomen."]}, "legraise": {"s": ["Acostate boca arriba con las manos bajo la cadera y las piernas estiradas.", "Subí las piernas juntas hasta formar unos 90° con el torso.", "Bajalas lento sin llegar a tocar el piso y sin arquear la espald e, con las manos al costado de la cadera, y deslizá la cola hacia adelante.", "Bajá flexionando los codos hacia atrás, hasta unos 90°.", "Empujá hasta estirar los brazos, con los hombros lejos de las orejas."], "e": ["Bajar demasiado y cargar el hombro.", "Abrir los codos hacia los costados."]}, "pike": {"s": ["Empezá en cuatro apoyos y levantá la cadera para formar una V invertida, con brazos y piernas casi estirados.", "Flexioná los codos y bajá la cabeza entre las manos, hacia el piso.", "Empujá hasta volver a estirar los brazos."], "e": ["Flexionar las rodillas y perder la V.", "Apoyar la cabeza con fuerza en el piso."]}, "superman": {"s": ["Acostate boca abajo con los brazos estirados al frente.", "Subí brazos y piernas del piso a la vez, mirando al piso para no forzar el cuello.", "Hacé una pausa de 1 a 2 segundos arriba y bajá lento."], "e": ["Levantar la cabeza y arquear el cuello.", "Subir con impulso en lugar de con la espalda."]}, "brow": {"s": ["Sentate en el piso con las piernas estiradas y la banda pasando por los pies.", "Con la espalda recta, tirá de la banda hacia el abdomen juntando las escápulas.", "Volvé lento hasta estirar los brazos."], "e": ["Inclinarte hacia atrás para tirar.", "Encoger los hombros hacia las orejas."]}, "mclimb": {"s": ["Empezá en posición de plancha con las manos debajo de los hombros.", "Llevá una rodilla hacia el pecho y volvé, alternando con ritmo controlado.", "Mantené la cadera baja y el abdomen firme todo el tiempo."], "e": ["Subir la cadera como una carpa.", "Ir tan rápido que se pierde la postura."]}, "deadbug": {"s": ["Acostate boca arriba con los brazos al techo y las rodillas a 90° sobre la cadera.", "Bajá a la vez un brazo y la pierna contraria hacia el piso, sin que se despegue la espalda baja.", "Volvé al centro y alterná. Exhalá al bajar."], "e": ["Dejar que se arquee la espalda baja.", "Bajar demasiado rápido."]}, "birddog": {"s": ["Ponete en cuatro apoyos, con las manos debajo de los hombros y las rodillas debajo de la cadera.", "Estirá un brazo y la pierna contraria hasta formar una línea recta con la espalda.", "Hacé una pausa de 2 segundos sin girar la cadera y volvé. Alterná."], "e": ["Rotar la cadera o arquear la espalda.", "Levantar la pierna demasiado alto."]}, "bicycle": {"s": ["Acostate boca arriba con las manos a los costados de la cabeza y las piernas elevadas.", "Llevá un codo hacia la rodilla contraria mientras estirás la otra pierna.", "Alterná con ritmo lento y controlado."], "e": ["Tirar del cuello con las manos.", "Ir muy rápido sin rotar el torso."]}, "catcow": {"s": ["Ponete en cuatro apoyos, con las manos debajo de los hombros y las rodillas debajo de la cadera.", "Exhalando, redondeá la espalda y llevá el mentón hacia el pecho.", "Inhalando, arqueá suave la espalda y subí la mirada. Movimiento lento y sin dolor."], "e": ["Forzar el movimiento hasta que moleste.", "Mover solo el cuello y no toda la columna."]}, "bagsquat": {"s": ["Abrazá la mochila contra el pecho con los pies al ancho de hombros.", "Bajá con la espalda recta, llevando la cadera atrás y las rodillas alineadas con los pies.", "Subí empujando con todo el pie."], "e": ["Inclinar el torso hacia adelante.", "Dejar que las rodillas se metan hacia adentro."]}, "bagrow": {"s": ["Con la mochila en las manos, inclinate hacia adelante con la espalda recta y las rodillas apenas flexionadas.", "Llevá la mochila hacia el ombligo con los codos cerca del cuerpo.", "Bajá controlado sin redondear la espalda."], "e": ["Redondear la espalda.", "Subir el torso para ayudarte."]}, "bagrdl": {"s": ["Parate con la mochila frente a los muslos y las rodillas apenas flexionadas.", "Llevá la cadera hacia atrás y deslizá la mochila pegada a las piernas, con la espalda neutra.", "Subí apretando los glúteos."], "e": ["Redondear la espalda.", "Doblar mucho las rodillas."]}, "bagohp": {"s": ["Parate con la mochila a la altura de los hombros, sostenida con las dos manos.", "Apretá abdomen y glúteos y empujá la mochila hacia arriba hasta estirar los brazos.", "Bajá lento hasta los hombros."], "e": ["Arquear la espalda baja.", "Dejar que la mochila se vaya hacia adelante."]}, "kbgoblet": {"s": ["Sostené la kettlebell por los costados del mango, frente al pecho.", "Bajá entre las rodillas con el torso erguido y los talones apoyados.", "Subí empujando con todo el pie."], "e": ["Inclinar el torso hacia adelante.", "Dejar que las rodillas se metan hacia adentro."]}, "kbdl": {"s": ["Parate con la kettlebell entre los pies, al ancho de hombros.", "Llevá la cadera hacia atrás con la espalda recta y agarrala con las dos manos.", "Subí empujando el piso hasta quedar parado, y bajá controlado."], "e": ["Redondear la espalda.", "Tirar con los brazos en lugar de usar las piernas y la cadera."]}, "swing": {"s": ["Parate con los pies más abiertos que los hombros y la kettlebell un paso por delante.", "Llevá la cadera atrás y pasá la kettlebell entre las piernas, con la espalda recta.", "Empujá la cadera hacia adelante con fuerza: la kettlebell sube hasta el pecho sola. Los brazos solo guían."], "e": ["Hacer una sentadilla en lugar de una bisagra de cadera.", "Levantar la kettlebell con los hombros o arquear la espalda arriba. Empezá con poco peso."]}, "bandcurl": {"s": ["Pisá la banda con los dos pies y agarrala con las palmas hacia arriba.", "Subí las manos hacia los hombros con los codos pegados al cuerpo.", "Bajá lento resistiendo la banda."], "e": ["Balancear el torso.", "Soltar la banda de golpe al bajar."]}, "bandohp": {"s": ["Pisá la banda y llevá las manos a la altura de los hombros.", "Apretá el abdomen y empujá hacia arriba hasta estirar los brazos.", "Bajá lento resistiendo la banda."], "e": ["Arquear la espalda baja.", "Dejar que la banda te tire los brazos hacia adelante."]}, "fbcurl": {"s": ["Acostate boca arriba con los talones sobre la pelota y los brazos a los costados.", "Subí la cadera hasta formar una línea recta de los hombros a los pies.", "Flexioná las rodillas para acercar la pelota a los glúteos y volvé lento."], "e": ["Dejar caer la cadera durante el movimiento.", "Mover la pelota con impulso."]}, "fbtuck": {"s": ["Empezá en plancha con las manos en el piso y las espinillas sobre la pelota.", "Llevá las rodillas hacia el pecho haciendo rodar la pelota.", "Estirá las piernas de nuevo, lento, sin dejar caer la cadera."], "e": ["Dejar caer la cadera de golpe.", "Subir mucho la cola."]}, "trxrow": {"s": ["Agarrá las cintas con las palmas enfrentadas e inclinate hacia atrás con el cuerpo recto.", "Tirá del cuerpo hacia las manos juntando las escápulas.", "Bajá lento hasta estirar los brazos. Cuanto más horizontal, más difícil."], "e": ["Dejar caer la cadera.", "Tirar solo con los brazos."]}, "trxpush": {"s": ["Agarrá las cintas, estirá los brazos y formá una línea recta con el cuerpo.", "Bajá hasta que las manos queden a los costados del pecho.", "Empujá hasta estirar los brazos."], "e": ["Dejar caer la cadera.", "Abrir mucho los codos."]}, "mbbridge": {"s": ["Acostate boca arriba con la mini banda sobre las rodillas y los pies apoyados.", "Subí la cadera empujando las rodillas hacia afuera contra la banda.", "Apretá los glúteos 1 segundo arriba y bajá lento."], "e": ["Dejar que las rodillas se junten.", "Arquear la espalda baja."]}, "mbkick": {"s": ["Parate con la mini banda sobre las rodillas y sostenete de algo estable.", "Llevá una pierna hacia atrás con la rodilla casi estirada, sin arquear la espalda.", "Apretá el glúteo arriba y volvé lento. Repetí por lado."], "e": ["Arquear la espalda baja para subir más.", "Inclinar el torso hacia adelante."]}, "hangleg": {"s": ["Colgate de la barra con los brazos estirados y los hombros activos (sin encogerlos).", "Subí las piernas con control hasta la altura de la cadera.", "Bajalas lento, sin balancearte. Si te cuesta, flexioná las rodillas."], "e": ["Balancearte para subir.", "Soltar las piernas de golpe."]}, "incpush": {"s": ["Apoyá las manos en una pared firme o en un banco, un poco más abiertas que los hombros.", "Con el cuerpo en línea recta, bajá el pecho hacia la pared o el banco.", "Empujá hasta estirar los brazos. Cuanto más baja la superficie, más difícil."], "e": ["Dejar caer la cadera.", "Llevar la cabeza adelante sin bajar el pecho."]}, "stepbw": {"s": ["Parate frente a un escalón o banco firme y apoyá todo el pie de una pierna.", "Subí empujando con esa pierna, sin impulsarte con la de abajo.", "Bajá controlado con la misma pierna, sin dejarte caer."], "e": ["Impulsarte con la pierna de atrás.", "Dejar que la rodilla se meta hacia adentro."]}};
var WX={"3 a 5 minutos de cardio suave (cinta, bici, trote o saltar la soga) hasta entrar en calor": "Hacelo a un ritmo en el que puedas conversar. Buscá sentir el cuerpo tibio y la respiración un poco más rápida, sin llegar a cansarte.", "10 círculos de brazos hacia adelante y hacia atrás": "De pie, con los brazos estirados a los costados, hacé círculos grandes y lentos: primero hacia adelante y después hacia atrás.", "10 rotaciones de torso, lentas": "De pie, con los pies al ancho de hombros y las manos en la cintura o cruzadas al pecho. Girá el torso hacia un lado y hacia el otro, sin mover la cadera.", "10 círculos de cadera por lado": "De pie, apoyate en algo si hace falta. Levantá una rodilla y llevala hacia afuera haciendo un círculo grande con la cadera. Después cambiá de lado.", "10 sentadillas con peso corporal, bajando lento": "Con los pies al ancho de hombros, bajá lento llevando la cadera atrás y subí. Es para preparar las piernas, sin llegar a cansarte.", "10 puentes de glúteos": "Boca arriba con las rodillas flexionadas. Subí la cadera apretando los glúteos y bajá lento.", "Tobillo: 10 rodillas hacia la pared por lado": "De frente a una pared, con un pie adelante. Llevá la rodilla hacia la pared sin despegar el talón y volvé.", "1 o 2 series de aproximación con la mitad del peso del primer ejercicio": "Hacé el primer ejercicio del día con la mitad del peso, en 6 a 8 repeticiones suaves. Sirve para practicar el movimiento antes de las series de verdad.", "10 rotaciones de hombros hacia atrás": "De pie, llevá los hombros hacia arriba, atrás y abajo, en círculos lentos.", "Rotación torácica: 8 por lado (de rodillas, mano en la nuca)": "En cuatro apoyos, poné una mano en la nuca. Girá el torso llevando el codo hacia el techo y volvé. Repetí y cambiá de lado.", "10 flexiones inclinadas o aperturas de pecho con banda": "Hacé flexiones con las manos en una pared o un banco, o abrí los brazos con una banda detrás de la espalda. Suave, sin llegar a cansarte.", "10 círculos de muñeca": "Con los dedos entrelazados o con las manos libres, rotá las muñecas en círculos hacia un lado y hacia el otro.", "1 o 2 series de aproximación con la mitad del peso": "Hacé el primer ejercicio del día con la mitad del peso, en 6 a 8 repeticiones suaves. Sirve para practicar el movimiento antes de las series de verdad.", "Gato-vaca: 10 repeticiones lentas": "En cuatro apoyos, redondeá la espalda exhalando y arqueala suave inhalando, moviendo toda la columna.", "10 retracciones de escápulas (juntá los omóplatos)": "De pie o sentado, con los brazos a los costados, juntá los omóplatos hacia atrás y abajo, sin encoger los hombros, y soltá.", "10 rotaciones externas de hombro con banda o sin peso": "Con el codo pegado al costado y doblado a 90°, llevá el antebrazo hacia afuera, con la banda o sin peso, y volvé lento.", "10 bisagras de cadera con la espalda recta": "De pie, llevá la cadera hacia atrás con las rodillas apenas flexionadas y la espalda recta, hasta sentir el estiramiento atrás del muslo. Volvé empujando la cadera hacia adelante.", "3 a 5 minutos caminando suave para bajar las pulsaciones": "Caminá a un ritmo cómodo hasta que la respiración vuelva a la normalidad.", "5 respiraciones lentas: inhalá por la nariz 4 segundos, exhalá 6": "Inhalá por la nariz contando hasta 4 y exhalá despacio por la boca contando hasta 6. Llevá el aire al abdomen.", "Cuádriceps de pie: 30 s por pierna": "De pie, agarrá un pie por detrás y llevalo hacia el glúteo, con las rodillas juntas. Sostenete de algo si perdés el equilibrio. Mantené 30 segundos.", "Isquiotibiales sentado, inclinándote desde la cadera: 30 s por pierna": "Sentado con una pierna estirada, inclinate hacia adelante desde la cadera con la espalda recta, hasta sentir el estiramiento atrás del muslo.", "Zancada baja para flexores de cadera: 30 s por lado": "Con una rodilla apoyada en el piso y el otro pie adelante, llevá la cadera suavemente hacia adelante hasta sentir el estiramiento en el frente de la cadera.", "Gemelos contra la pared: 30 s por pierna": "Con las manos en la pared, estirá una pierna atrás con el talón apoyado y flexioná la de adelante, hasta sentir el estiramiento en el gemelo.", "Pecho en el marco de una puerta: 30 s por lado": "Apoyá el antebrazo en el marco de una puerta, con el codo a la altura del hombro, y girá el cuerpo hacia el lado contrario hasta sentir el estiramiento en el pecho.", "Tríceps por detrás de la cabeza: 30 s por brazo": "Llevá un brazo detrás de la cabeza con el codo hacia arriba y empujalo suave con la otra mano.", "Hombro cruzado: 30 s por brazo": "Cruzá un brazo estirado frente al pecho y sostenelo con el otro brazo, sin girar el torso.", "Postura del niño (dorsales): 40 s": "De rodillas, sentate sobre los talones y estirá los brazos al frente apoyando la frente en el piso. Respirá hondo.", "Bíceps con la palma en la pared: 30 s por brazo": "Apoyá la palma en una pared con el brazo estirado y los dedos hacia atrás, y girá el cuerpo suavemente hacia el lado contrario.", "Cuello: inclinación lateral suave, 20 s por lado": "Sentado o de pie, llevá la oreja hacia el hombro sin levantar el hombro. Podés ayudarte con muy poca presión de la mano. Nunca fuerces el cuello.", "Sentadilla profunda sostenida: 3 × 30 s": "Bajá a una sentadilla profunda con los talones apoyados y empujá las rodillas hacia afuera con los codos. Si los talones se levantan, apoyalos sobre un libro o sostenete de algo.", "Zancada con rotación de torso: 8 por lado": "Dá un paso largo adelante y bajá. Con las manos juntas, girá el torso hacia el lado de la pierna adelantada y volvé. Cambiá de pierna.", "Círculos de cadera en cuadrupedia: 8 por lado": "En cuatro apoyos, levantá una rodilla hacia afuera y hacé círculos grandes con la cadera, sin mover el torso.", "Puente de glúteos con pausa: 10 repeticiones": "Igual que el puente de glúteos, pero con una pausa de 2 segundos arriba apretando los glúteos.", "Rotación torácica: 8 por lado": "En cuatro apoyos, con una mano en la nuca, girá el torso llevando el codo hacia el techo y volvé.", "Colgarte de una barra o puerta firme: 3 × 20 s": "Agarrate de una barra bien fija con los brazos estirados y dejá que el cuerpo cuelgue, con los hombros activos. Solo si el soporte aguanta tu peso con seguridad.", "Respiración diafragmática: 2 minutos": "Acostate o sentate cómodo con una mano en el abdomen. Inhalá por la nariz inflando el abdomen y exhalá lento por la boca."};

Object.assign(EN,{"Anotá lo que vas tomando en el día: cada vez que tomes agua, tocá un botón. La barra se va llenando hasta tu meta. No tenés que escribir nada.":"Log what you drink during the day: each time you have water, tap a button. The bar fills up toward your goal. You don't need to type anything.","+ 250 ml = un vaso. + 500 ml = una botella chica. Deshacer resta 250 ml si te equivocaste. La cuenta empieza de cero cada día. Tu meta se calcula con tu peso (unos 35 ml por kilo); si todavía no cargaste tu peso, es de 2000 ml.":"+ 250 ml = one glass. + 500 ml = a small bottle. Undo subtracts 250 ml if you made a mistake. The count starts from zero every day. Your goal is based on your weight (about 35 ml per kg); if you haven't entered your weight yet, it is 2000 ml."});
Object.assign(EN,{"Acostate con los ojos bajo la barra, los pies firmes en el piso y las escápulas juntas hacia abajo.": "Lie down with your eyes under the bar, feet firm on the floor and shoulder blades pinched down.", "Sacá la barra con los brazos estirados y bajala controlada hasta el pecho medio.": "Unrack the bar with straight arms and lower it under control to the middle of your chest.", "Empujá hacia arriba en línea recta hasta estirar los brazos, sin despegar la cadera del banco.": "Press straight up until your arms are straight, without lifting your hips off the bench.", "Rebotar la barra en el pecho.": "Bouncing the bar off your chest.", "Abrir demasiado los codos o levantar la cadera. Con cargas altas, pedí que alguien te cuide.": "Flaring the elbows too wide or lifting the hips. With heavy loads, ask someone to spot you.", "Regulá el banco a unos 30° y sentate con la espalda y los pies firmes.": "Set the bench to about 30° and sit with your back and feet firm.", "Empezá con las mancuernas a la altura del pecho y empujá hacia arriba sin chocarlas.": "Start with the dumbbells at chest level and press up without clicking them together.", "Bajá lento hasta sentir el estiramiento en el pecho, con los antebrazos verticales.": "Lower slowly until you feel a stretch in the chest, with your forearms vertical.", "Subir demasiado el banco: pasa a ser un press de hombros.": "Setting the bench too high: it turns into a shoulder press.", "Dejar caer las mancuernas hacia los costados.": "Letting the dumbbells drift out to the sides.", "De pie, con la barra apoyada en la parte alta del pecho y el agarre un poco más ancho que los hombros.": "Stand with the bar resting on your upper chest and a grip slightly wider than your shoulders.", "Apretá glúteos y abdomen y empujá la barra en línea recta, echando la cara apenas hacia atrás.": "Squeeze glutes and abs and press the bar straight up, moving your face slightly back.", "Terminá con la barra sobre la cabeza y los brazos e <script>
/* ===== pack12: figuras con cuerpo también en cardio (reemplazan a los palitos) =====
   Toma las posiciones de articulaciones que ya calculan runner/biker/climber/ellip/roper
   (cadera, rodilla, tobillo, hombro, codo, mano) y dibuja segmentos con volumen.
   El pie se orienta según el tobillo: apoyado plano en el piso y con flexión plantar en el aire,
   dentro de un rango anatómico respecto de la tibia. */
(function(){
if(typeof drawC!=="function"||typeof cLimb!=="function")return;
var st=document.createElement("style");st.textContent=
".cfg .bd path{stroke:none}"+
".cfg .bd path.tor{fill:none;stroke:var(--ac);stroke-width:19;stroke-linecap:round;stroke-linejoin:round}"+
".cfg .bd .sk{fill:#e3ad8c}.cfg .bd .sk2{fill:#c48e6e}.cfg .bd .sr{fill:var(--ac)}.cfg .bd .sr2{fill:var(--ac);filter:brightness(.78)}"+
".cfg .bd .so{fill:#3a4663}.cfg .bd .so2{fill:#2c364d}"+
".cfg .bd .shoe{fill:#f3f4f7;stroke:#222a3a;stroke-width:.9}.cfg .bd .shoe2{fill:#cfd3db;stroke:#222a3a;stroke-width:.9}"+
".cfg .bd .hair{fill:#33241a}.cfg .bd .eye{fill:#1b1410}.cfg .bd path.mo{fill:none;stroke:#7a4f3a;stroke-width:.9;stroke-linecap:round}"+
".cfg .bd path.tor.fr{stroke-width:16}"+".cfg line.lm{stroke:var(--mut);stroke-width:3;opacity:1}";
document.head.appendChild(st);

function n2(v){return Math.round(v*10)/10}
function CAP(ax,ay,bx,by,ra,rb){var dx=bx-ax,dy=by-ay,l=Math.hypot(dx,dy)||1,nx=-dy/l,ny=dx/l;
 return "M"+n2(ax+nx*ra)+","+n2(ay+ny*ra)+"L"+n2(bx+nx*rb)+","+n2(by+ny*rb)+"A"+rb+","+rb+" 0 0 0 "+n2(bx-nx*rb)+","+n2(by-ny*rb)+"L"+n2(ax-nx*ra)+","+n2(ay-ny*ra)+"A"+ra+","+ra+" 0 0 0 "+n2(ax+nx*ra)+","+n2(ay+ny*ra)+"Z"}
function CIR(cx,cy,r){return "M"+n2(cx-r)+","+n2(cy)+"a"+r+","+r+" 0 1,0 "+2*r+",0a"+r+","+r+" 0 1,0 "+(-2*r)+",0z"}
function PART(ax,ay,bx,by,t0,t1,ra,rb){var dx=bx-ax,dy=by-ay;return CAP(ax+dx*t0,ay+dy*t0,ax+dx*t1,ay+dy*t1,ra+(rb-ra)*t0,ra+(rb-ra)*t1)}
function P(cls,d){return '<path class="'+cls+'" d="'+d+'"/>'}
function smt(x){x=x<0?0:x>1?1:x;return x*x*(3-2*x)}
function near(a,b){return Math.abs(a[0]-b[0])<.6&&Math.abs(a[1]-b[1])<.6}

/* Registro: mientras se arma una figura de cardio, las funciones de dibujo anotan articulaciones en vez de dibujar palitos */
var REC=null,cL0=cL,cLimb0=cLimb,cHead0=cHead;
function tok(r){REC.push(r);return "<!--T"+(REC.length-1)+"-->"}
cLimb=function(p,c){return REC?tok({t:"limb",p:p,far:/far/.test(c||"")}):cLimb0(p,c)};
cL=function(a,b,c,w){if(REC&&c&&/^lm(\s|$)/.test(c)&&!w)return tok({t:c==="lm"?"trunk":"seg",a:a,b:b,far:/far/.test(c)});return cL0(a,b,c,w)};

/* pie: perpendicular a la tibia hacia adelante; plano si apoya en el piso; en el aire, flexión plantar.
   Ángulo pie-tibia limitado a 70°–140° (rel −110°…−40°) (dorsiflexión / flexión plantar). */
function footDir(kn,an,gnd){
 var ux=an[0]-kn[0],uy=an[1]-kn[1],ul=Math.hypot(ux,uy)||1;ux/=ul;uy/=ul;

 var air=gnd==null?1:smt((gnd-an[1]-2)/9);
 var want=(1-air)*0+air*(perpA+.45);     /* 0 = plano; en el aire, punta hacia abajo */
 var rel=want-shinA;while(rel>Math.PI)rel-=2*Math.PI;while(rel<-Math.PI)rel+=2*Math.PI;
 /* rel es el ángulo desde la tibia hasta el pie (sentido antihorario en pantalla = negativo) */

 rel=Math.max(lo,Math.min(hi,rel));
 var a=shinA+rel;return [Math.cos(a),Math.sin(a)]}

function render(R,fg){

  R.forEach(function(r,k){if(r.t==="mark"){flush();fr=r.front;out[k]="";return}seg.push(r);idx.push(k)});flush();return out}

 var lastLeg={};
 return R.map(function(r){
  if(r.t==="trunk"){
   var Sx=S[0]-ux*(front?2:3),Sy=S[1]-uy*(front?2:3);
   return '<g class="bd">'+P(front?"tor fr":"tor","M"+n2(H[0])+","+n2(H[1])+"L"+n2(Sx)+","+n2(Sy))+P("so",front?CAP(H[0]-7,H[1],H[0]+7,H[1],9.4,9.4):CIR(H[0],H[1],9.6))+'</g>'}
  if(r.t==="limb"){
   var p=r.p,f=r.far,leg=near(p[0],H)||(!near(p[0],S)&&p[0][1]>=H[1]-2);

function frontFig(cx,hy,L,A,o){o=o||{};var sh=hy-34,ow=o.armOut||0,s="";

function legY(th,k){return {k:24*Math.cos(th),a:24*Math.cos(th)+24*Math.cos(th-k)}}
function armY(al,E){return {e:17*Math.cos(al),h:17*Math.cos(al)+16*Math.cos(al+E)}}

var mark0=0;

/* ---------- marcha: correr, caminar, trotar, senderismo, cuestas ---------- */
var RUNM={run:{f:1.4,A:42,K:95,lean:11,E:88,S:44,fly:4},jog:{f:1.15,A:34,K:80,lean:8,E:80,S:36,fly:2},walk:{f:.85,A:24,K:30,lean:2,E:25,S:24,fly:0},hike:{f:.75,A:22,K:34,lean:7,E:22,S:20,fly:0},tread:{f:1.0,A:30,K:60,lean:5,E:60,S:30,fly:1}};

 if(kind==="tread"){var uu=(t%12)/12;m=uu>.5?{f:1.35,A:42,K:95,lean:11,E:88,S:44,fly:2}:{f:.9,A:26,K:34,lean:3,E:30,S:26,fly:0}}
 st.ph+=dt*m.f*2*Math.PI;var v=m.f*4*24*Math.sin(m.A*RD);st.pos+=v*dt;var psi=st.ph,pos=st.pos;
 function leg(o){var p=psi+o,th=m.A*Math.sin(p)*RD,kk=m.K*(.25+.75*Math.max(0,Math.cos(p)))*RD;return {th:th,k:kk,dy:24*Math.cos(th)+24*Math.cos(th-kk)}}
 var a=leg(0),b=leg(Math.PI),hx=100,hy=G-Math.max(a.dy,b.dy)-m.fly*Math.abs(Math.sin(psi));
 function lp(l,c){var kn=[hx+24*Math.sin(l.th),hy+24*Math.cos(l.th)],an=[kn[0]+24*Math.sin(l.th-l.k),kn[1]+24*Math.cos(l.th-l.k)];return cLimb([[hx,hy],kn,an],c)+cL(an,[an[0]+7,an[1]+1],"lm "+c)}
 var ln=m.lean*RD,sh=[hx+34*Math.sin(ln),hy-34*Math.cos(ln)];

 function ar(o,c){var al=ang(o),el=[sh[0]+17*Math.sin(al),sh[1]+17*Math.cos(al)],ha=[el[0]+16*Math.sin(al+m.E*RD),el[1]+16*Math.cos(al+m.E*RD)];return cLimb([sh,el,ha],c)}

 else side+='<line class="mc" x1="-60" y1="118" x2="260" y2="118" stroke-width="2"/>'+trees(pos)+ground(pos,-20,205,118);

 /* frente: mismas articulaciones, vistas de frente con un poco de perspectiva (lo que va hacia adelante se ve más abajo y más grande) */
 function LP(l){var kn=[hx+24*Math.sin(l.th),hy+24*Math.cos(l.th)],an=[kn[0]+24*Math.sin(l.th-l.k),kn[1]+24*Math.cos(l.th-l.k)];return [kn,an]}

 var o='<line class="mc" x1="0" y1="118" x2="200" y2="118" stroke-width="2"/>',prof="",kmin=mach?-2:-4,kmax=mach?3:6,k;

  o+='<line class="mc" x1="150" y1="56" x2="150" y2="30" stroke-width="5"/><rect class="mf" x="140" y="20" width="28" height="12" rx="3"/>';
  o+='<line class="rail" x1="96" y1="58" x2="150" y2="40"/><line class="post" x1="100" y1="58" x2="100" y2="84"/>'}
 else{var r0=nose(-4),r1=nose(6),hh=-30;o+=prof+'<line class="rail" x1="'+f1(r0[0]-10)+'" y1="'+f1(r0[1]+hh)+'" x2="'+f1(r1[0])+'" y2="'+f1(r1[1]+hh)+'"/>';
  for(k=kmin;k<=kmax;k+=2){var pp=nose(k);o+='<line class="post" x1="'+f1(pp[0]-10)+'" y1="'+f1(pp[1])+'" x2="'+f1(pp[0]-10)+'" y2="'+f1(pp[1]+hh)+'"/>'}}
 /* pies: el de apoyo queda plano en su escalón; el otro pasa por arriba del borde y apoya dos escalones más arriba */
 var A0=[110,hy+33],A1=[90,hy+44],lead=n%2;
 function stance(){return [A0[0]-RUN*u,A0[1]+RISE*u]}

 function lg(f,c,air){var r=ik2(hx,hy,f[0],f[1],24,24,"fwd"),toe=air?[r.e[0]+6.6,r.e[1]+2.6]:[r.e[0]+7,r.e[1]];return {s:cLimb([[hx,hy],r.k,r.e],c)+cL(r.e,toe,"lm "+c),k:r.k,e:r.e}}

 function ar(sw,c){var P=arP(sw);if(mach){var r=ik2(sh[0],sh[1],P[1][0],P[1][1],17,16,"down");P=[r.k,r.e]}return {s:cLimb([sh,P[0],P[1]],c),P:P}}
 var swA=lead?Math.sin(Math.PI*u):-Math.sin(Math.PI*u);
 var MK=mark(false),LA=lg(fa,"",lead),LB=lg(fb,"far",!lead),AA=ar(-swA,""),AB=ar(swA,"far");

 if(mach)fr+='<path class="mach" d="M206 126 L226 30 L232 30 L216 126 Z"/><path class="mach" d="M296 126 L274 30 L268 30 L284 126 Z"/><rect class="mf" x="234" y="18" width="32" height="10" rx="3"/>';
 else fr+='<line class="rail" x1="212" y1="126" x2="230" y2="20"/><line class="rail" x1="288" y1="126" x2="270" y2="20"/>';

/* ---------- saltar la soga ---------- */
function rope(id,t){var st=S2({ph:0,lt:t},id),dt=Math.max(0,Math.min(.1,t-st.lt));st.lt=t;st.ph+=dt*1.6*2*Math.PI;var ps=st.ph;

 var c=Math.cos(ps-Math.PI),lift=c>0?10*Math.pow(c,1.6):0,land=c<-.55?(-.55-c)/.45:0,crouch=3.2*land;
 var hy=G-46-lift+crouch,o="";

 var hx=100,sh=[hx+1.5,hy-34],toeDown=lift>2;

 var rp='<path class="rope'+(behind?" bk":"")+'" d="M'+f1(wr[0])+' '+f1(wr[1])+' Q'+f1(m1[0])+' '+f1(m1[1])+' '+f1(px)+' '+f1(py)+'"/>';
 var side='<line class="mc" x1="0" y1="118" x2="200" y2="118" stroke-width="2"/>'+'<ellipse cx="'+hx+'" cy="119" rx="'+f1(15-lift*.6)+'" ry="2.2" fill="var(--ln)" opacity=".7"/>';
 side+=(behind?rp:"")+mark(false)+lgS(-3,"far")+arS("far",-2)+cL([hx,hy],sh,"lm")+cHead(hx,hy-45)+lgS(3,"")+arS("",0)+(behind?"":rp);
 /* ---- frente ---- */
 var fx=250,fsh=hy-34,out=22,wl=[fx-out-2+2.4*Math.cos(ps),fsh+30+2.4*Math.sin(ps)],wR=[fx+out+2-2.4*Math.cos(ps),fsh+30+2.4*Math.sin(ps)];

<div id="brio-gate" style="display:none;position:fixed;inset:0;z-index:2147483647;background:#0B0D10;color:#F2F4F5;font-family:Inter,system-ui,sans-serif;padding:32px;box-sizing:border-box;flex-direction:column;justify-content:center;gap:16px">
  <div style="font-size:44px;font-weight:800">Tu prueba terminó</div>
  <div style="font-size:18px;color:#AEB6BF;line-height:1.4">Ingresá tu código de activación para seguir usando brío con todas sus funciones.</div>
  <input id="brio-code" placeholder="BRIO-XXXX-XXXX-XXXX" autocomplete="off" autocapitalize="characters" style="height:58px;font-size:20px;border-radius:14px;border:1.5px solid #2A3036;background:#14191E;color:#F2F4F5;padding:0 16px;text-transform:uppercase">
  <button id="brio-go" style="height:58px;border:0;border-radius:14px;background:#D4FF3A;color:#0B0D10;font-size:20px;font-weight:700">Activar</button>
  <div id="brio-msg" style="color:#FF8A8A;font-size:16px;min-height:22px"></div>
</div>
<script>
(function(){
  var TRIAL_DAYS = 14;
  var KEY_START = 'brio_trial_inicio';
  var KEY_OK = 'brio_activada';
  // Hashes SHA-256 de los códigos válidos. Los administra tools/generar_codigos.js
  var HASHES = [
/*BRIO_HASHES_INICIO*/
    '39bda54e6cd032513b84e7da664af3914c5d88954e22bac95b5affd0c319eb3a',
    '02adae9d66d44cedb098f5dd45033231c062442246c5ef7d16faecc7ffbe0b23',
    'cbb287c85b69b876d48c3e0935739a73ea2ded381ac22cb4bf9225a8196bf48b',
    '0b4617cf3085fc5c3fd24be79f0d928e3988a3b4e41f8ddbe8658731dcdf4d89',
    'a857769c0a3325e6bc952b38e0cdceaef151e56fc905e37041911a54ba9fe40d'
  /*BRIO_HASHES_FIN*/
  ];
  var gate = document.getElementById('brio-gate');
  var input = document.getElementById('brio-code');
  var msg = document.getElementById('brio-msg');

  var start = parseInt(localStorage.getItem(KEY_START) || '0', 10);
  if (!start) { start = Date.now(); localStorage.setItem(KEY_START, String(start)); }
  var activada = localStorage.getItem(KEY_OK) === '1';
  var vencida = !activada && (Date.now() - start) > TRIAL_DAYS * 86400000;
  if (vencida) gate.style.display = 'flex';

  async function sha256(texto) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(texto));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  document.getElementById('brio-go').addEventListener('click', async function () {
    var codigo = input.value.replace(/\s/g, '').toUpperCase();
    if (!codigo) { msg.textContent = 'Escribí tu código.'; return; }
    var h = await sha256(codigo);
    if (HASHES.indexOf(h) !== -1) {
      localStorage.setItem(KEY_OK, '1');
      gate.style.display = 'none';
      msg.textContent = '';
    } else {
      msg.textContent = 'Código no válido. Revisalo e intentá de nuevo.';
    }
  });
})();
</script>
